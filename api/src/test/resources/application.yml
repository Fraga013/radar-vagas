# Perfil de teste: H2 em memoria.
# Assim `mvn test` e a CI do GitHub rodam sem precisar de Docker nem Postgres.
spring:
  datasource:
    url: jdbc:h2:mem:radar;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    # Atencao: este arquivo SUBSTITUI o application.yml de main no classpath de
    # teste - ele nao faz merge. Toda propriedade que os testes precisam tem de
    # estar repetida aqui.
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
